<style>

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;position:relative;z-index:1}.card{background:rgba(255,255,255,.96);border:1px solid #dfe8f3;border-radius:20px;overflow:hidden;box-shadow:0 8px 28px rgba(15,23,42,.055);transition:var(--transition);display:flex;flex-direction:column}.card:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:rgba(37,99,235,.2)}.thumb{height:215px;background:linear-gradient(135deg,#e5efff,#e4f9fc);position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .fallback{height:100%;display:flex;align-items:center;justify-content:center;font-size:55px;color:rgba(37,99,235,.2)}.category{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.94);color:var(--primary);padding:5px 10px;border-radius:30px;font-size:10px;font-weight:700;box-shadow:0 5px 15px rgba(15,23,42,.1)}.body{padding:21px 21px 20px;display:flex;flex-direction:column;flex:1}.body h3{font-size:18px;margin:0 0 8px;font-weight:700}.body p{font-size:13px;color:var(--muted);margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;margin-bottom:18px}.tag{font-size:10px;padding:5px 8px;border-radius:7px;background:#eef4fa;color:#526079;border:1px solid #e4ebf3}.view{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gradient);color:#fff;border:0;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:700;transition:var(--transition);cursor:pointer}.view:hover{color:#fff;transform:translateY(-2px);box-shadow:0 9px 22px rgba(37,99,235,.22)}

.footer{background:linear-gradient(135deg,#0f172a,#16243d);color:rgba(255,255,255,.65);padding:42px 0}.footin{display:flex;justify-content:space-between;align-items:center;gap:20px}.footbrand{font-size:22px;font-weight:800;color:#fff}.footbrand span{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.foot p{margin:5px 0 0;font-size:12px}.foot a{color:#fff;font-size:13px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(9,17,35,.65);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.dialog{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.dialoghead{height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.dialoghead h2{margin:0;font-size:20px}.close{border:0;background:#f1f5f9;color:#526079;width:36px;height:36px;border-radius:50%;font-size:21px;cursor:pointer}.detail{padding:24px}.slider{position:relative;width:100%;height:min(430px,55vw);min-height:230px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#eef4ff,#ecfeff);box-shadow:0 12px 35px rgba(15,23,42,.08)}.slides{width:100%;height:100%;display:flex;transition:transform .65s cubic-bezier(.4,0,.2,1)}.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center}.slide img{width:100%;height:100%;object-fit:contain;background:#f8fbff}.slide-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:1px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(15,23,42,.45);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;backdrop-filter:blur(8px)}.slide-arrow:hover{background:rgba(37,99,235,.85)}.slide-prev{left:14px}.slide-next{right:14px}.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px;z-index:3}.dot{width:8px;height:8px;border:0;border-radius:50%;background:rgba(255,255,255,.55);padding:0;cursor:pointer;transition:.25s}.dot.active{width:24px;border-radius:9px;background:#fff}.gallery-count{position:absolute;right:14px;top:14px;padding:5px 9px;border-radius:20px;background:rgba(15,23,42,.55);color:#fff;font-size:10px;z-index:3;backdrop-filter:blur(8px)}.detailcat{display:inline-block;color:var(--primary);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:20px}.detail h3{font-size:27px;margin:6px 0 10px}.detail p{color:var(--muted);font-size:14px;white-space:pre-line}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.detailbox{background:#f8fafc;border-radius:14px;padding:17px}.detailbox h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:0 0 9px;color:#475569}.detailbox div{font-size:13px;color:#64748b;white-space:pre-line}.live{display:inline-flex;margin-top:22px;background:var(--gradient);color:#fff;padding:12px 20px;border-radius:11px;font-weight:700;font-size:13px}.live:hover{color:#fff}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.navin{height:66px}.hero{padding:65px 0 50px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.thumb{height:205px}.footin{flex-direction:column;text-align:center}.detailgrid{grid-template-columns:1fr}.detail h3{font-size:23px}.slider{height:62vw;min-height:210px}.slide-arrow{width:36px;height:36px}.detail{padding:17px}}
</style>

<section class="hero"><div class="container"><div class="eyebrow">Our Products</div><h1>Digital Products We've <span class="gradient">Built</span></h1><p>Explore web applications and digital solutions created by HOPIX Tech Solutions for real business needs.</p></div></section>
<section class="section"><div class="container"><div class="toolbar"><div class="count" id="count">Loading products...</div><div class="searchwrap"><i class="bi bi-search"></i><input id="search" class="search" placeholder="Search products..."></div></div><div id="grid" class="grid"><div class="state"><div class="spinner"></div>Loading products...</div></div></div></section>

<div id="modal" class="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Product</h2><button id="close" class="close">×</button></div><div id="detail" class="detail"></div></div></div>
<script>
const SUPABASE_URL='https://zfgjhunmdpqzpmdnqtyv.supabase.co',SUPABASE_KEY='sb_publishable_grTmssZ9sTu5YKXrH0ET6A_8wDNP2IT';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),modal=document.getElementById('modal'),detail=document.getElementById('detail'),modalTitle=document.getElementById('modalTitle');let products=[],slideIndex=0,slideTimer=null,touchStartX=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function arr(v){if(Array.isArray(v))return v;if(!v)return[];return String(v).split(/[,\n]+/).map(x=>x.trim()).filter(Boolean)}function field(p,...keys){for(const k of keys)if(p[k]!==undefined&&p[k]!==null&&p[k]!=='')return p[k];return''}
function gallery(p){let g=Array.isArray(p.gallery_images)?p.gallery_images.filter(Boolean):[];const main=field(p,'image_url','image','main_image_url');if(main&&!g.includes(main))g.unshift(main);return g.slice(0,6)}
function render(){const q=search.value.trim().toLowerCase(),list=products.filter(p=>(field(p,'name','product_name')+' '+field(p,'category')+' '+field(p,'short_description','short')).toLowerCase().includes(q));count.textContent=`${list.length} product${list.length===1?'':'s'} published`;if(!list.length){grid.innerHTML='<div class="state"><i class="bi bi-box-seam" style="font-size:34px;display:block;margin-bottom:10px;color:#94a3b8"></i>No published products found.</div>';return}grid.innerHTML=list.map(p=>{const name=field(p,'name','product_name')||'HOPIX Product',cat=field(p,'category')||'Digital Product',desc=field(p,'short_description','short','description')||'A digital product built by HOPIX Tech Solutions.',img=field(p,'image_url','image','main_image_url'),tech=arr(field(p,'technologies','tech'));return `<article class="card"><div class="thumb">${img?`<img src="${esc(img)}" alt="${esc(name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="fallback" style="${img?'display:none':''}"><i class="bi bi-window-stack"></i></div><span class="category">${esc(cat)}</span></div><div class="body"><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="tags">${tech.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><button class="view" data-id="${esc(p.id)}">View Product <i class="bi bi-arrow-right"></i></button></div></article>`}).join('');document.querySelectorAll('.view').forEach(b=>b.onclick=()=>openProduct(products.find(p=>p.id===b.dataset.id)))}
function openProduct(p){if(!p)return;stopSlider();const name=field(p,'name','product_name')||'HOPIX Product',cat=field(p,'category')||'Digital Product',desc=field(p,'description','full_description','short_description','short')||'No description available.',tech=arr(field(p,'technologies','tech')),features=arr(field(p,'features')),url=field(p,'product_url','url','web_url','live_url'),imgs=gallery(p);slideIndex=0;modalTitle.textContent=name;let slider=imgs.length?`<div class="slider" id="slider"><div class="slides" id="slides">${imgs.map((src,i)=>`<div class="slide"><img src="${esc(src)}" alt="${esc(name)} screenshot ${i+1}"></div>`).join('')}</div>${imgs.length>1?`<button class="slide-arrow slide-prev" id="prev"><i class="bi bi-chevron-left"></i></button><button class="slide-arrow slide-next" id="next"><i class="bi bi-chevron-right"></i></button><div class="dots" id="dots">${imgs.map((_,i)=>`<button class="dot ${i===0?'active':''}" data-dot="${i}"></button>`).join('')}</div><span class="gallery-count" id="galleryCount">1 / ${imgs.length}</span>`:''}</div>`:'';detail.innerHTML=`${slider}<span class="detailcat">${esc(cat)}</span><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="detailgrid"><div class="detailbox"><h4>Technologies</h4><div>${esc(tech.join(' • ')||'Not specified')}</div></div><div class="detailbox"><h4>Features</h4><div>${esc(features.join('\n')||'Not specified')}</div></div></div>${url?`<a class="live" href="${esc(url)}" target="_blank" rel="noopener">Visit Live Product <i class="bi bi-box-arrow-up-right ms-2"></i></a>`:''}`;modal.classList.add('show');document.body.style.overflow='hidden';if(imgs.length>1){document.getElementById('prev').onclick=()=>goSlide(-1);document.getElementById('next').onclick=()=>goSlide(1);document.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>goSlideTo(+b.dataset.dot));const s=document.getElementById('slider');s.addEventListener('mouseenter',stopSlider);s.addEventListener('mouseleave',startSlider);s.addEventListener('touchstart',e=>touchStartX=e.changedTouches[0].screenX,{passive:true});s.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>40)goSlide(dx>0?-1:1)},{passive:true});startSlider()}}
function updateSlider(){const slides=document.getElementById('slides'),dots=document.querySelectorAll('[data-dot]'),gc=document.getElementById('galleryCount');if(!slides)return;slides.style.transform=`translateX(-${slideIndex*100}%)`;dots.forEach((d,i)=>d.classList.toggle('active',i===slideIndex));if(gc)gc.textContent=`${slideIndex+1} / ${dots.length}`}
function goSlide(dir){const dots=document.querySelectorAll('[data-dot]');if(!dots.length)return;slideIndex=(slideIndex+dir+dots.length)%dots.length;updateSlider();startSlider()}
function goSlideTo(i){slideIndex=i;updateSlider();startSlider()}
function startSlider(){stopSlider();const dots=document.querySelectorAll('[data-dot]');if(dots.length>1)slideTimer=setInterval(()=>{slideIndex=(slideIndex+1)%dots.length;updateSlider()},3500)}function stopSlider(){if(slideTimer){clearInterval(slideTimer);slideTimer=null}}
function closeModal(){stopSlider();modal.classList.remove('show');document.body.style.overflow=''}document.getElementById('close').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});search.oninput=render;
async function load(){try{const {data,error}=await sb.from('products').select('*').eq('status','published').order('created_at',{ascending:false});if(error)throw error;products=data||[];render()}catch(e){console.error(e);count.textContent='Could not load products';grid.innerHTML='<div class="state"><i class="bi bi-exclamation-circle" style="font-size:34px;display:block;margin-bottom:10px;color:#dc2626"></i>Products could not be loaded right now.<br><small>Please check the public read policy for the products table in Supabase.</small></div>'}}load();
</script></body></html>
