<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOPIX Products | Digital Products & Web Applications</title>
<meta name="description" content="Explore digital products and web applications built by HOPIX Tech Solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#2563eb;--cyan:#06b6d4;--navy:#0f172a;--muted:#64748b;--light:#f8fafc;--white:#fff;--line:#e8eef6;--gradient:linear-gradient(135deg,#2563eb 0%,#06b6d4 100%);--shadow:0 18px 55px rgba(15,23,42,.09);--transition:all .35s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Poppins,sans-serif;color:var(--navy);background:#fff;line-height:1.7}a{text-decoration:none}.container{width:min(1180px,calc(100% - 36px));margin:auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(15,23,42,.06)}.navin{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:27px;font-weight:800;letter-spacing:-1px;color:var(--navy)}.brand span{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.back{color:#334155;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}.back:hover{color:var(--primary)}
.hero{padding:92px 0 65px;text-align:center;background:linear-gradient(180deg,#eff6ff 0%,#fff 78%);position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(75px);pointer-events:none}.hero:before{width:380px;height:380px;background:rgba(37,99,235,.12);right:-140px;top:-160px}.hero:after{width:300px;height:300px;background:rgba(6,182,212,.1);left:-130px;bottom:-130px}.eyebrow{display:inline-flex;gap:8px;align-items:center;color:var(--primary);font-size:12px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}.eyebrow:before{content:"";width:28px;height:2px;background:var(--gradient);border-radius:9px}.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.15;margin:15px 0 15px;font-weight:800;letter-spacing:-1.5px}.gradient{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.hero p{max-width:650px;margin:0 auto;color:var(--muted);font-size:16px}
.section{padding:55px 0 95px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.count{color:var(--muted);font-size:13px}.search{width:min(320px,100%);border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 40px;outline:none;font:inherit;font-size:13px;background:#fff}.search:focus{border-color:#9bb9fa;box-shadow:0 0 0 4px rgba(37,99,235,.08)}.searchwrap{position:relative}.searchwrap i{position:absolute;left:14px;top:12px;color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 25px rgba(15,23,42,.045);transition:var(--transition);display:flex;flex-direction:column}.card:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:rgba(37,99,235,.15)}.thumb{height:215px;background:linear-gradient(135deg,#eef4ff,#ecfeff);position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .fallback{height:100%;display:flex;align-items:center;justify-content:center;font-size:55px;color:rgba(37,99,235,.2)}.category{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);color:var(--primary);padding:5px 10px;border-radius:30px;font-size:10px;font-weight:700;box-shadow:0 5px 15px rgba(15,23,42,.08)}.body{padding:21px 21px 20px;display:flex;flex-direction:column;flex:1}.body h3{font-size:18px;margin:0 0 8px;font-weight:700}.body p{font-size:13px;color:var(--muted);margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;margin-bottom:18px}.tag{font-size:10px;padding:5px 8px;border-radius:7px;background:#f1f5f9;color:#526079}.view{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gradient);color:#fff;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:700;transition:var(--transition)}.view:hover{color:#fff;transform:translateY(-2px);box-shadow:0 9px 22px rgba(37,99,235,.22)}
.state{text-align:center;padding:70px 20px;color:var(--muted);grid-column:1/-1}.spinner{width:34px;height:34px;border:3px solid #dbe7fb;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}
.footer{background:var(--navy);color:rgba(255,255,255,.65);padding:42px 0}.footin{display:flex;justify-content:space-between;align-items:center;gap:20px}.footbrand{font-size:22px;font-weight:800;color:#fff}.footbrand span{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.foot p{margin:5px 0 0;font-size:12px}.foot a{color:#fff;font-size:13px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(9,17,35,.65);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.dialog{width:min(880px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.dialoghead{height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.dialoghead h2{margin:0;font-size:20px}.close{border:0;background:#f1f5f9;color:#526079;width:36px;height:36px;border-radius:50%;font-size:21px;cursor:pointer}.detail{padding:24px}.detailimg{width:100%;max-height:380px;object-fit:cover;border-radius:16px;background:#eef4ff}.detailcat{display:inline-block;color:var(--primary);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:20px}.detail h3{font-size:27px;margin:6px 0 10px}.detail p{color:var(--muted);font-size:14px;white-space:pre-line}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.detailbox{background:#f8fafc;border-radius:14px;padding:17px}.detailbox h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:0 0 9px;color:#475569}.detailbox div{font-size:13px;color:#64748b;white-space:pre-line}.live{display:inline-flex;margin-top:22px;background:var(--gradient);color:#fff;padding:12px 20px;border-radius:11px;font-weight:700;font-size:13px}.live:hover{color:#fff}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.navin{height:66px}.hero{padding:65px 0 50px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.thumb{height:205px}.footin{flex-direction:column;text-align:center}.detailgrid{grid-template-columns:1fr}.detail h3{font-size:23px}}
</style>
</head>
<body>
<header class="nav"><div class="container navin"><a class="brand" href="index.html">HOPI<span>X</span></a><a class="back" href="index.html"><i class="bi bi-arrow-left"></i> Back to HOPIX</a></div></header>
<section class="hero"><div class="container"><div class="eyebrow">Our Products</div><h1>Digital Products We've <span class="gradient">Built</span></h1><p>Explore web applications and digital solutions created by HOPIX Tech Solutions for real business needs.</p></div></section>
<section class="section"><div class="container"><div class="toolbar"><div class="count" id="count">Loading products...</div><div class="searchwrap"><i class="bi bi-search"></i><input id="search" class="search" placeholder="Search products..."></div></div><div id="grid" class="grid"><div class="state"><div class="spinner"></div>Loading products...</div></div></div></section>
<footer class="footer"><div class="container footin"><div><div class="footbrand">HOPI<span>X</span></div><p>Modern website, software and IT solutions.</p></div><a href="index.html#contact">Start a Project <i class="bi bi-arrow-right"></i></a></div></footer>
<div id="modal" class="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Product</h2><button id="close" class="close">×</button></div><div id="detail" class="detail"></div></div></div>
<script>
const SUPABASE_URL='https://zfgjhunmdpqzpmdnqtyv.supabase.co';
const SUPABASE_KEY='sb_publishable_grTmssZ9sTu5YKXrH0ET6A_8wDNP2IT';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search');
const modal=document.getElementById('modal'),detail=document.getElementById('detail'),modalTitle=document.getElementById('modalTitle');
let products=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function arr(v){if(Array.isArray(v))return v;if(!v)return[];return String(v).split(/[,\n]+/).map(x=>x.trim()).filter(Boolean)}
function field(p,...keys){for(const k of keys)if(p[k]!==undefined&&p[k]!==null&&p[k]!=='')return p[k];return''}
function render(){const q=search.value.trim().toLowerCase();const list=products.filter(p=>(field(p,'name','product_name')+' '+field(p,'category')+' '+field(p,'short_description','short')).toLowerCase().includes(q));count.textContent=`${list.length} product${list.length===1?'':'s'} published`;if(!list.length){grid.innerHTML='<div class="state"><i class="bi bi-box-seam" style="font-size:34px;display:block;margin-bottom:10px;color:#94a3b8"></i>No published products found.</div>';return}grid.innerHTML=list.map((p,i)=>{const name=field(p,'name','product_name')||'HOPIX Product';const cat=field(p,'category')||'Digital Product';const desc=field(p,'short_description','short','description')||'A digital product built by HOPIX Tech Solutions.';const img=field(p,'image_url','image','main_image_url');const tech=arr(field(p,'technologies','tech'));return `<article class="card"><div class="thumb">${img?`<img src="${esc(img)}" alt="${esc(name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="fallback" style="${img?'display:none':''}"><i class="bi bi-window-stack"></i></div><span class="category">${esc(cat)}</span></div><div class="body"><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="tags">${tech.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><button class="view" data-index="${products.indexOf(p)}">View Product <i class="bi bi-arrow-right"></i></button></div></article>`}).join('');document.querySelectorAll('.view').forEach(b=>b.onclick=()=>openProduct(products[+b.dataset.index]));}
function openProduct(p){const name=field(p,'name','product_name')||'HOPIX Product';const cat=field(p,'category')||'Digital Product';const img=field(p,'image_url','image','main_image_url');const desc=field(p,'description','full_description','short_description','short')||'No description available.';const tech=arr(field(p,'technologies','tech'));const features=arr(field(p,'features'));const url=field(p,'product_url','url','web_url','live_url');modalTitle.textContent=name;detail.innerHTML=`${img?`<img class="detailimg" src="${esc(img)}" alt="${esc(name)}">`:''}<span class="detailcat">${esc(cat)}</span><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="detailgrid"><div class="detailbox"><h4>Technologies</h4><div>${esc(tech.join(' • ')||'Not specified')}</div></div><div class="detailbox"><h4>Features</h4><div>${esc(features.join('\n')||'Not specified')}</div></div></div>${url?`<a class="live" href="${esc(url)}" target="_blank" rel="noopener">Visit Live Product <i class="bi bi-box-arrow-up-right ms-2"></i></a>`:''}`;modal.classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('show');document.body.style.overflow=''}document.getElementById('close').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});search.oninput=render;
async function load(){try{const {data,error}=await sb.from('products').select('*').eq('status','published').order('created_at',{ascending:false});if(error)throw error;products=data||[];render()}catch(e){console.error(e);count.textContent='Could not load products';grid.innerHTML=`<div class="state"><i class="bi bi-exclamation-circle" style="font-size:34px;display:block;margin-bottom:10px;color:#dc2626"></i>Products could not be loaded right now.<br><small>Please check the public read policy for the products table in Supabase.</small></div>`}}
load();
</script>
</body>
</html>
