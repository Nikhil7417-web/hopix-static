<!doctype html>

<head>

<meta name="description" content="Explore digital products and web applications built by HOPIX Tech Solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--p:#2563eb;--c:#06b6d4;--n:#0f172a;--m:#64748b;--g:linear-gradient(135deg,#2563eb,#06b6d4)}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;color:var(--n);background:#f3f7fc}.container{width:min(1180px,calc(100% - 36px));margin:auto}.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid #e2e8f0}.navin{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:27px;font-weight:800;color:var(--n);text-decoration:none}.brand span,.gradient{background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.back{color:#334155;font-weight:600;text-decoration:none;font-size:14px}.hero{text-align:center;padding:85px 0 60px;background:linear-gradient(180deg,#eaf3ff,#f3f7fc)}.hero h1{font-size:clamp(2rem,5vw,3.4rem);margin:14px 0;font-weight:800}.hero p{max-width:650px;margin:auto;color:var(--m)}.eyebrow{color:var(--p);font-size:12px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}.section{padding:50px 0 90px}.toolbar{display:flex;justify-content:space-between;gap:15px;margin-bottom:25px}.count{color:#52647b;font-size:13px;font-weight:600}.search{width:min(320px,100%);padding:11px 14px;border:1px solid #d7e2ee;border-radius:13px;outline:0;font:inherit;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid #dfe8f3;border-radius:20px;overflow:hidden;box-shadow:0 8px 28px rgba(15,23,42,.055);transition:.35s}.card:hover{transform:translateY(-7px);box-shadow:0 18px 55px rgba(15,23,42,.12)}.thumb{height:215px;background:linear-gradient(135deg,#e5efff,#e4f9fc);position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.cat{position:absolute;left:14px;top:14px;background:#fff;color:var(--p);padding:5px 10px;border-radius:30px;font-size:10px;font-weight:700}.body{padding:20px;display:flex;flex-direction:column;min-height:205px}.body h3{font-size:18px;margin:0 0 8px}.body p{font-size:13px;color:var(--m);margin:0 0 16px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;margin-bottom:16px}.tag{font-size:10px;padding:5px 8px;border-radius:7px;background:#eef4fa;color:#526079}.view{display:inline-flex;justify-content:center;gap:8px;background:var(--g);color:#fff;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:700;border:0;cursor:pointer}.state{text-align:center;padding:70px 20px;color:var(--m);grid-column:1/-1}.footer{background:#0f172a;color:#fff;padding:40px 0}.footin{display:flex;justify-content:space-between;align-items:center}.foot a{color:#fff;text-decoration:none}.modal{position:fixed;inset:0;background:rgba(9,17,35,.68);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px}.head{padding:18px 22px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}.detail{padding:22px}.detail img{width:100%;max-height:430px;object-fit:contain;border-radius:16px;background:#f8fbff}.detail h2{font-size:26px}.detail p{color:var(--m);white-space:pre-line}.live{display:inline-block;background:var(--g);color:#fff;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:1fr}.toolbar,.footin{flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<header class="nav"><div class="container navin"><a class="brand" href="../">HOPI<span>X</span></a><a class="back" href="../"><i class="bi bi-arrow-left"></i> Back to HOPIX</a></div></header>
<section class="hero"><div class="container"><div class="eyebrow">Our Products</div><h1>Digital Products We've <span class="gradient">Built</span></h1><p>Explore web applications and digital solutions created by HOPIX Tech Solutions for real business needs.</p></div></section>
<section class="section"><div class="container"><div class="toolbar"><div class="count" id="count">Loading products...</div><input id="search" class="search" placeholder="Search products..."></div><div id="grid" class="grid"><div class="state">Loading products...</div></div></div></section>
<footer class="footer"><div class="container footin"><div><strong>HOPI<span>X</span></strong><div>Modern website, software and IT solutions.</div></div><a href="../#contact">Start a Project <i class="bi bi-arrow-right"></i></a></div></footer>
<div id="modal" class="modal"><div class="dialog"><div class="head"><strong id="mt">Product</strong><button id="close" class="close">×</button></div><div id="detail" class="detail"></div></div></div>
<script>
const URL='https://zfgjhunmdpqzpmdnqtyv.supabase.co',KEY='sb_publishable_grTmssZ9sTu5YKXrH0ET6A_8wDNP2IT';
const sb=window.supabase.createClient(URL,KEY),grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),modal=document.getElementById('modal'),detail=document.getElementById('detail'),mt=document.getElementById('mt');let products=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const val=(p,...ks)=>{for(const k of ks)if(p[k]!=null&&p[k]!=='')return p[k];return''};const arr=v=>Array.isArray(v)?v:(v?String(v).split(/[,\n]+/).map(x=>x.trim()).filter(Boolean):[]);
function render(){const q=search.value.trim().toLowerCase(),list=products.filter(p=>(val(p,'name','product_name')+' '+val(p,'category')+' '+val(p,'short_description','description')).toLowerCase().includes(q));count.textContent=`${list.length} product${list.length===1?'':'s'} published`;if(!list.length){grid.innerHTML='<div class="state">No published products found.</div>';return}grid.innerHTML=list.map((p,i)=>{const name=val(p,'name','product_name')||'HOPIX Product',cat=val(p,'category')||'Digital Product',desc=val(p,'short_description','short','description')||'A digital product built by HOPIX Tech Solutions.',img=val(p,'image_url','image','main_image_url'),tech=arr(val(p,'technologies','tech'));return `<article class="card"><div class="thumb">${img?`<img src="${esc(img)}" alt="${esc(name)}">`:''}<span class="cat">${esc(cat)}</span></div><div class="body"><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="tags">${tech.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><button class="view" onclick="openProduct(${i})">View Product <i class="bi bi-arrow-right"></i></button></div></article>`}).join('');window.currentList=list}
window.openProduct=function(i){const p=window.currentList[i],name=val(p,'name','product_name')||'HOPIX Product',desc=val(p,'description','short_description','short')||'',img=val(p,'image_url','image','main_image_url'),url=val(p,'live_url','website_url','demo_url','url');mt.textContent=name;detail.innerHTML=`${img?`<img src="${esc(img)}" alt="${esc(name)}">`:''}<h2>${esc(name)}</h2><p>${esc(desc)}</p>${url?`<a class="live" href="${esc(url)}" target="_blank" rel="noopener">Open Live Product <i class="bi bi-box-arrow-up-right"></i></a>`:''}`;modal.classList.add('show')};
document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};search.oninput=render;
(async()=>{try{const {data,error}=await sb.from('products').select('*').eq('is_published',true).order('created_at',{ascending:false});if(error)throw error;products=data||[];render()}catch(e){console.error(e);count.textContent='';grid.innerHTML='<div class="state">Products are temporarily unavailable. Please try again shortly.</div>'}})();
</script>
</body></html>
