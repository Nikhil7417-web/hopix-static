<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOPIX Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--p:#2563eb;--a:#06b6d4;--d:#0f172a;--m:#64748b;--g:linear-gradient(135deg,#2563eb,#06b6d4)}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:#f6f8fc;color:var(--d)}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#dbeafe,transparent 35%),#f8fafc}.cardx{background:#fff;border:1px solid #e7edf5;border-radius:22px;box-shadow:0 15px 50px #0f172a12}.loginbox{width:min(430px,100%);padding:38px}.brand{font-size:2rem;font-weight:800;text-align:center}.grad{background:var(--g);-webkit-background-clip:text;color:transparent}.muted{color:var(--m);font-size:.9rem}.form-control,.form-select{border-radius:10px;padding:11px}.btn-main{background:var(--g);border:0;color:#fff;border-radius:10px;padding:10px 18px;font-weight:600}.btn-main:hover{color:#fff;opacity:.92}#app{display:none}.top{background:#fff;border-bottom:1px solid #e7edf5;position:sticky;top:0;z-index:5}.topin{min-height:70px;display:flex;align-items:center;justify-content:space-between}.page{padding:30px 0}.stat,.panel{padding:20px;background:#fff;border:1px solid #e7edf5;border-radius:17px;box-shadow:0 5px 25px #0f172a08}.num{font-size:1.7rem;font-weight:700}.label{font-size:.8rem;color:var(--m)}.prod{padding:12px;border:1px solid #e5eaf1;border-radius:13px;margin-bottom:10px;display:flex;gap:14px;align-items:center}.prod img{width:72px;height:58px;object-fit:cover;border-radius:9px;background:#eef2f7}.badgex{font-size:.7rem;border-radius:20px;padding:4px 8px}.pub{background:#dcfce7;color:#166534}.draft{background:#fef3c7;color:#92400e}.modal-content{border:0;border-radius:20px}.err{display:none}</style>
</head>
<body>
<section id="login" class="login"><div class="cardx loginbox"><div class="brand grad">HOPIX</div><p class="text-center muted mb-4">Product Administration Panel</p><form id="loginForm"><label class="form-label">Email</label><input id="email" type="email" class="form-control mb-3" autocomplete="username" required><label class="form-label">Password</label><input id="password" type="password" class="form-control mb-3" autocomplete="current-password" required><div id="loginErr" class="alert alert-danger py-2 err"></div><button class="btn btn-main w-100">Login</button></form></div></section>
<section id="app"><header class="top"><div class="container topin"><div><b class="grad fs-4">HOPIX</b> <span class="muted">Admin</span></div><div class="d-flex gap-3 align-items-center"><span id="adminEmail" class="muted"></span><button id="logout" class="btn btn-outline-secondary btn-sm">Logout</button></div></div></header><main class="page"><div class="container"><div class="d-flex justify-content-between align-items-center mb-4 gap-3 flex-wrap"><div><h2 class="fw-bold mb-1">Product Dashboard</h2><p class="muted mb-0">Manage products shown on HOPIX.</p></div><button id="add" class="btn btn-main"><i class="bi bi-plus-lg"></i> Add New Product</button></div><div class="row g-3 mb-4"><div class="col-6 col-lg-3"><div class="stat"><div class="label">Total</div><div id="total" class="num">0</div></div></div><div class="col-6 col-lg-3"><div class="stat"><div class="label">Published</div><div id="published" class="num">0</div></div></div><div class="col-6 col-lg-3"><div class="stat"><div class="label">Drafts</div><div id="drafts" class="num">0</div></div></div></div><div class="panel"><div class="d-flex justify-content-between mb-3"><h5 class="mb-0">Products</h5><button id="refresh" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></button></div><div id="list"></div></div></div></main></section>
<div class="modal fade" id="productModal"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><form id="productForm"><div class="modal-header"><h5 id="title" class="fw-bold">Add Product</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="pid" type="hidden"><div class="row g-3"><div class="col-md-8"><label class="form-label">Product Name *</label><input id="name" class="form-control" required></div><div class="col-md-4"><label class="form-label">Category</label><input id="category" class="form-control" value="Web Application"></div><div class="col-12"><label class="form-label">Short Description</label><textarea id="short" class="form-control" rows="2"></textarea></div><div class="col-12"><label class="form-label">Full Description</label><textarea id="desc" class="form-control" rows="5"></textarea></div><div class="col-md-8"><label class="form-label">Product / Web App URL</label><input id="url" type="url" class="form-control" placeholder="https://..."></div><div class="col-md-4"><label class="form-label">Status</label><select id="status" class="form-select"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="col-12"><label class="form-label">Technologies</label><input id="tech" class="form-control" placeholder="Django, Python, SQL"><small class="text-secondary">Comma separated</small></div><div class="col-12"><label class="form-label">Features</label><textarea id="features" class="form-control" rows="3" placeholder="Feature 1, Feature 2, Feature 3"></textarea><small class="text-secondary">Comma separated</small></div><div class="col-12"><label class="form-label">Main Image URL</label><input id="image" type="url" class="form-control" placeholder="https://..."><small class="text-secondary">Image upload/storage can be added next.</small></div></div><div id="formErr" class="alert alert-danger py-2 mt-3 err"></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="save" class="btn btn-main">Save Product</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
const URL='https://zfgjhunmdpqzpmdnqtyv.supabase.co';const KEY='sb_publishable_grTmssZ9sTu5YKXrH0ET6A_8wDNP2IT';const sb=window.supabase.createClient(URL,KEY);window.addEventListener('error',e=>{const b=document.getElementById('loginErr');if(b){b.textContent='Admin panel error: '+(e.message||'Please refresh the page.');b.style.display='block'}});const modal=new bootstrap.Modal(document.getElementById('productModal'));let editing=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
async function adminOK(user){const{data}=await sb.from('admin_profiles').select('role').eq('user_id',user.id).maybeSingle();return data?.role==='admin'}async function start(){try{const{data,error}=await sb.auth.getSession();if(error){$('loginErr').textContent='Supabase connection error: '+error.message;$('loginErr').style.display='block';return}if(data.session){if(await adminOK(data.session.user))showApp(data.session.user.email);else{await sb.auth.signOut();$('loginErr').textContent='Login is valid, but this account is not marked as an HOPIX admin.';$('loginErr').style.display='block'}}}catch(err){$('loginErr').textContent='Could not connect to Supabase: '+(err.message||err);$('loginErr').style.display='block'}}function showApp(email){$('login').style.display='none';$('app').style.display='block';$('adminEmail').textContent=email||'';load()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginErr').style.display='none';const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginErr').textContent='Login failed: '+error.message;$('loginErr').style.display='block';return}if(!(await adminOK(data.user))){await sb.auth.signOut();$('loginErr').textContent='This account is not authorized as admin.';$('loginErr').style.display='block';return}showApp(data.user.email)});$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function load(){$('list').innerHTML='<p class="muted">Loading...</p>';const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<p class="text-danger">'+esc(error.message)+'</p>';return}const a=data||[];$('total').textContent=a.length;$('published').textContent=a.filter(x=>x.status==='published').length;$('drafts').textContent=a.filter(x=>x.status==='draft').length;if(!a.length){$('list').innerHTML='<div class="text-center muted py-4">No products yet.</div>';return}$('list').innerHTML=a.map(p=>`<div class="prod"><img src="${esc(p.image_url||'')}" onerror="this.style.visibility='hidden'"><div class="flex-grow-1"><b>${esc(p.name)}</b> <span class="badgex ${p.status==='published'?'pub':'draft'}">${p.status}</span><div class="small muted">${esc(p.short_description||p.category||'')}</div></div><button class="btn btn-sm btn-outline-secondary" onclick="edit('${p.id}')"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="del('${p.id}')"><i class="bi bi-trash"></i></button></div>`).join('')}$('refresh').onclick=load}
$('add').onclick=()=>{editing=null;$('title').textContent='Add Product';$('productForm').reset();$('category').value='Web Application';$('status').value='draft';$('formErr').style.display='none';modal.show()};window.edit=async id=>{const{data,error}=await sb.from('products').select('*').eq('id',id).single();if(error)return alert(error.message);editing=id;$('title').textContent='Edit Product';$('name').value=data.name||'';$('category').value=data.category||'Web Application';$('short').value=data.short_description||'';$('desc').value=data.description||'';$('url').value=data.product_url||'';$('status').value=data.status||'draft';$('tech').value=(data.technologies||[]).join(', ');$('features').value=(data.features||[]).join(', ');$('image').value=data.image_url||'';$('formErr').style.display='none';modal.show()};
$('productForm').onsubmit=async e=>{e.preventDefault();$('formErr').style.display='none';$('save').disabled=true;$('save').textContent='Saving...';const payload={name:$('name').value.trim(),slug:slug($('name').value),category:$('category').value.trim()||'Web Application',short_description:$('short').value.trim(),description:$('desc').value.trim(),product_url:$('url').value.trim(),status:$('status').value,technologies:$('tech').value.split(',').map(x=>x.trim()).filter(Boolean),features:$('features').value.split(',').map(x=>x.trim()).filter(Boolean),image_url:$('image').value.trim()};const r=editing?await sb.from('products').update(payload).eq('id',editing):await sb.from('products').insert(payload);$('save').disabled=false;$('save').textContent='Save Product';if(r.error){$('formErr').textContent=r.error.message;$('formErr').style.display='block';return}modal.hide();load()};window.del=async id=>{if(!confirm('Delete this product permanently?'))return;const{error}=await sb.from('products').delete().eq('id',id);if(error)return alert(error.message);load()};start();
</script></body></html>
