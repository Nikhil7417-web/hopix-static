<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOPIX Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:430px;background:#fff;padding:32px;border-radius:20px;box-shadow:0 15px 45px #0001}.brand{text-align:center;font-size:32px;font-weight:800;background:linear-gradient(135deg,#2563eb,#06b6d4);-webkit-background-clip:text;color:transparent}.sub{text-align:center;color:#64748b;margin:8px 0 28px}label{display:block;font-weight:600;margin:15px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9e0ea;border-radius:10px;font-size:15px}button{cursor:pointer}.primary{width:100%;border:0;border-radius:10px;padding:13px;margin-top:20px;color:#fff;font-weight:700;font-size:15px;background:linear-gradient(135deg,#2563eb,#06b6d4)}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fee2e2;color:#991b1b;font-size:14px}.success{background:#dcfce7;color:#166534}.app{display:none}.nav{height:70px;background:#fff;border-bottom:1px solid #e5eaf1;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{max-width:1100px;margin:auto;padding:30px 20px}.navbrand{font-size:22px;font-weight:800}.logout{border:1px solid #ccd4df;background:#fff;border-radius:8px;padding:8px 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.cards{display:flex;gap:15px;flex-wrap:wrap}.stat{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:18px;min-width:170px;flex:1}.stat small{color:#64748b}.stat b{display:block;font-size:28px;margin-top:5px}.panel{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:20px;margin-top:20px}.add{border:0;background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border-radius:9px;padding:10px 15px;font-weight:700}.prod{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #edf0f4}.prod:last-child{border-bottom:0}.prod img{width:70px;height:55px;object-fit:cover;border-radius:8px;background:#eef2f7}.grow{flex:1}.muted{color:#64748b;font-size:13px}.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px}.published{background:#dcfce7;color:#166534}.draft{background:#fef3c7;color:#92400e}.actions button{border:1px solid #d8dee8;background:#fff;border-radius:7px;padding:7px;margin-left:5px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modalbox{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:25px}@media(max-width:650px){.row{grid-template-columns:1fr}.full{grid-column:auto}.nav{padding:0 15px}.content{padding:20px 14px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginPage" class="wrap"><div class="box"><div class="brand">HOPIX</div><div class="sub">Product Administration Panel</div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div id="loginMsg" class="msg"></div><button class="primary" type="submit">Login</button></form></div></div>
<div id="app" class="app"><div class="nav"><div class="navbrand">HOPIX <span class="muted">Admin</span></div><div><span id="who" class="muted"></span> <button id="logout" class="logout">Logout</button></div></div><div class="content"><div class="top"><div><h1>Product Dashboard</h1><div class="muted">Manage products shown on the HOPIX website.</div></div><button id="addBtn" class="add">+ Add New Product</button></div><div class="cards"><div class="stat"><small>Total Products</small><b id="total">0</b></div><div class="stat"><small>Published</small><b id="pub">0</b></div><div class="stat"><small>Drafts</small><b id="draft">0</b></div></div><div class="panel"><h3>Products</h3><div id="list">Loading...</div></div></div></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add Product</h2><button class="close" id="closeBtn">×</button></div><form id="productForm"><input id="editId" type="hidden"><div class="row"><div><label>Product Name *</label><input id="pname" required></div><div><label>Category</label><input id="category" value="Web Application"></div><div class="full"><label>Short Description</label><textarea id="short" rows="2"></textarea></div><div class="full"><label>Full Description</label><textarea id="description" rows="5"></textarea></div><div><label>Product / Web App URL</label><input id="url" type="url"></div><div><label>Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="full"><label>Technologies</label><input id="tech" placeholder="Django, Python, SQL"></div><div class="full"><label>Features</label><textarea id="features" rows="3" placeholder="Feature 1, Feature 2, Feature 3"></textarea></div><div class="full"><label>Main Image URL</label><input id="image" type="url"></div></div><div id="formMsg" class="msg"></div><button class="primary" id="saveBtn">Save Product</button></form></div></div>
<script>
(function(){
const SUPABASE_URL='https://zfgjhunmdpqzpmdnqtyv.supabase.co';
const SUPABASE_KEY='sb_publishable_grTmssZ9sTu5YKXrH0ET6A_8wDNP2IT';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function showMsg(el,text,success=false){el.textContent=text;el.className='msg '+(success?'success':'');el.style.display='block'}
function hideMsg(el){el.style.display='none'}
async function isAdmin(user){
 try{const r=await sb.from('admin_profiles').select('role').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;return r.data&&r.data.role==='admin'}catch(e){throw new Error('Admin profile check failed: '+e.message)}
}
async function openApp(user){$('loginPage').style.display='none';$('app').style.display='block';$('who').textContent=user.email||'';await loadProducts()}
async function boot(){
 try{const r=await sb.auth.getSession();if(r.error)throw r.error;if(r.data.session){if(await isAdmin(r.data.session.user))await openApp(r.data.session.user);else{await sb.auth.signOut();showMsg($('loginMsg'),'This account is not authorized as HOPIX admin.')}}}
 catch(e){showMsg($('loginMsg'),'Startup error: '+e.message)}
}
$('loginForm').addEventListener('submit',async function(e){e.preventDefault();hideMsg($('loginMsg'));const btn=this.querySelector('button');btn.disabled=true;btn.textContent='Checking...';try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;if(!await isAdmin(r.data.user)){await sb.auth.signOut();throw new Error('Login successful, but this email is not registered in admin_profiles as an admin.')}await openApp(r.data.user)}catch(e){showMsg($('loginMsg'),'Login error: '+e.message)}finally{btn.disabled=false;btn.textContent='Login'}});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
async function loadProducts(){try{const r=await sb.from('products').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;const rows=r.data||[];$('total').textContent=rows.length;$('pub').textContent=rows.filter(x=>x.status==='published').length;$('draft').textContent=rows.filter(x=>x.status==='draft').length;if(!rows.length){$('list').innerHTML='<p class="muted">No products added yet. Click Add New Product.</p>';return}$('list').innerHTML=rows.map(x=>'<div class="prod"><img src="'+esc(x.image_url)+'"><div class="grow"><b>'+esc(x.name)+'</b> <span class="badge '+(x.status==='published'?'published':'draft')+'">'+esc(x.status)+'</span><div class="muted">'+esc(x.short_description||x.category)+'</div></div><div class="actions"><button onclick="window.editProduct(\''+x.id+'\')">Edit</button><button onclick="window.deleteProduct(\''+x.id+'\')">Delete</button></div></div>').join('')}catch(e){$('list').innerHTML='<div class="msg" style="display:block">Could not load products: '+esc(e.message)+'</div>'}}
function arr(v){return (v||'').split(',').map(x=>x.trim()).filter(Boolean)}
function openModal(data){$('modal').style.display='flex';$('formMsg').style.display='none';if(data){$('modalTitle').textContent='Edit Product';$('editId').value=data.id;$('pname').value=data.name||'';$('category').value=data.category||'Web Application';$('short').value=data.short_description||'';$('description').value=data.description||'';$('url').value=data.product_url||'';$('status').value=data.status||'draft';$('tech').value=(data.technologies||[]).join(', ');$('features').value=(data.features||[]).join(', ');$('image').value=data.image_url||''}else{$('modalTitle').textContent='Add Product';$('productForm').reset();$('editId').value='';$('category').value='Web Application';$('status').value='draft'}}
$('addBtn').onclick=()=>openModal(null);$('closeBtn').onclick=()=>{$('modal').style.display='none'};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').style.display='none'};
window.editProduct=async id=>{try{const r=await sb.from('products').select('*').eq('id',id).single();if(r.error)throw r.error;openModal(r.data)}catch(e){alert('Could not open product: '+e.message)}};
window.deleteProduct=async id=>{if(!confirm('Delete this product?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return alert('Delete failed: '+r.error.message);loadProducts()};
$('productForm').addEventListener('submit',async function(e){e.preventDefault();hideMsg($('formMsg'));const b=$('saveBtn');b.disabled=true;b.textContent='Saving...';const payload={name:$('pname').value.trim(),category:$('category').value.trim(),short_description:$('short').value.trim(),description:$('description').value.trim(),product_url:$('url').value.trim(),status:$('status').value,technologies:arr($('tech').value),features:arr($('features').value),image_url:$('image').value.trim()};try{let r;if($('editId').value)r=await sb.from('products').update(payload).eq('id',$('editId').value);else r=await sb.from('products').insert(payload);if(r.error)throw r.error;$('modal').style.display='none';await loadProducts()}catch(e){showMsg($('formMsg'),'Save failed: '+e.message)}finally{b.disabled=false;b.textContent='Save Product'}});
boot();
})();
</script>
</body>
</html>
