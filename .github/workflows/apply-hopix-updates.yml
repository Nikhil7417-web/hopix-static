name: Apply HOPIX updates

on:
  push:
    paths:
      - '.github/workflows/apply-hopix-updates.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update website safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Add compact mobile dropdown + longer premium logo animation CSS.
          marker = '  </style>'
          css = r'''

    /* ── HOPIX premium logo animation ── */
    .navbar-brand-custom {
      position: relative;
      display: inline-block;
      transform-origin: left center;
      animation: hopixLogoEntrance 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .navbar-brand-custom span {
      display: inline-block;
      position: relative;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 220% 100%;
      animation: hopixXFlow 2.4s 0.9s ease-in-out both;
    }

    .navbar-brand-custom::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      border-radius: 999px;
      background: var(--gradient);
      animation: hopixUnderline 0.9s 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .navbar-brand-custom::before {
      content: '';
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: -8px;
      width: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      opacity: 0;
      transform: translateX(-8px) skewX(-14deg);
      filter: blur(0.5px);
      pointer-events: none;
      animation: hopixLightSweep 1s 1.25s ease-out forwards;
    }

    .navbar-brand-custom:hover {
      transform: translateY(-1px) scale(1.02);
    }

    @keyframes hopixLogoEntrance {
      0% { opacity: 0; transform: translateY(-12px) scale(0.94); letter-spacing: 1px; }
      55% { opacity: 1; transform: translateY(2px) scale(1.01); letter-spacing: -0.5px; }
      100% { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -0.5px; }
    }

    @keyframes hopixXFlow {
      0% { background-position: 0% 50%; }
      45% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes hopixUnderline {
      from { width: 0; }
      to { width: 32px; }
    }

    @keyframes hopixLightSweep {
      0% { opacity: 0; transform: translateX(-8px) skewX(-14deg); }
      18% { opacity: 0.95; }
      100% { opacity: 0; transform: translateX(55px) skewX(-14deg); }
    }

    /* ── Mobile navbar: compact dropdown ── */
    @media (max-width: 991.98px) {
      .navbar-custom {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: var(--shadow-sm);
      }

      .navbar-custom .container {
        position: relative;
      }

      #navbarNav {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        left: auto;
        width: min(235px, calc(100vw - 32px));
        z-index: 1050;
        background: rgba(255, 255, 255, 0.99);
        border: 1px solid rgba(37, 99, 235, 0.12);
        border-radius: 16px;
        padding: 10px;
        box-shadow: 0 18px 42px rgba(15, 23, 42, 0.17);
        transform-origin: top right;
      }

      #navbarNav .navbar-nav {
        gap: 2px;
      }

      #navbarNav .nav-link-custom {
        display: block;
        width: 100%;
        padding: 9px 12px !important;
        border-radius: 9px;
        font-size: 0.92rem;
      }

      #navbarNav .nav-link-custom:hover,
      #navbarNav .nav-link-custom.active {
        background: rgba(37, 99, 235, 0.07);
      }

      #navbarNav .nav-link-custom::after {
        display: none;
      }

      #navbarNav .btn-nav-cta {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 9px 14px !important;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .navbar-brand-custom,
      .navbar-brand-custom span,
      .navbar-brand-custom::before,
      .navbar-brand-custom::after {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
'''

          if '/* ── HOPIX premium logo animation ── */' not in text:
              if marker not in text:
                  raise SystemExit('Could not find closing style tag.')
              text = text.replace(marker, css + '\n' + marker, 1)

          # 2) Keep the existing HOPIX markup, but make the X the animated span.
          old_brand = '<a class="navbar-brand-custom" href="#home">HOPI<span>X</span></a>'
          new_brand = '<a class="navbar-brand-custom" href="#home" aria-label="HOPIX Home">HOPI<span>X</span></a>'
          if old_brand in text:
              text = text.replace(old_brand, new_brand, 1)

          # 3) Add the second phone number to the footer's Get In Touch block.
          old_phone = '''          <div class="footer-contact-item">
            <i class="bi bi-telephone"></i>
            <span>+91 7417477208</span>
          </div>'''
          new_phone = '''          <div class="footer-contact-item">
            <i class="bi bi-telephone"></i>
            <span>
              <a href="tel:+917417477208">+91 7417477208</a><br>
              <a href="tel:+917055889943">+91 7055889943</a>
            </span>
          </div>'''
          if old_phone in text and '+91 7055889943' not in text:
              text = text.replace(old_phone, new_phone, 1)

          # 4) Close the mobile dropdown when clicking anywhere outside it or pressing Escape.
          js_marker = '''    /* ── Close mobile menu on link click ── */'''
          js = '''    /* ── Close mobile dropdown on outside click / Escape ── */
    const hopixNavCollapse = document.getElementById('navbarNav');
    const hopixNavbar = document.getElementById('mainNavbar');

    document.addEventListener('click', (event) => {
      if (!hopixNavCollapse || !hopixNavCollapse.classList.contains('show')) return;
      if (!hopixNavbar.contains(event.target)) {
        bootstrap.Collapse.getOrCreateInstance(hopixNavCollapse).hide();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && hopixNavCollapse?.classList.contains('show')) {
        bootstrap.Collapse.getOrCreateInstance(hopixNavCollapse).hide();
      }
    });

'''
          if 'const hopixNavCollapse' not in text:
              if js_marker not in text:
                  raise SystemExit('Could not find navbar close handler marker.')
              text = text.replace(js_marker, js + js_marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-hopix-updates.yml
          git commit -m "Improve mobile navbar logo animation and contact numbers"
          git push
