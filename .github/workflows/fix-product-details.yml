name: Fix Product Details UI

on:
  push:
    paths:
      - '.github/workflows/fix-product-details.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch product UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')

          css = r'''
          /* Product details modal */
          .home-product-modal{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(8,16,34,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
          .home-product-modal.show{display:flex}
          .home-product-dialog{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.28);position:relative}
          .home-product-close{position:absolute;right:16px;top:16px;z-index:5;width:40px;height:40px;border:0;border-radius:50%;background:rgba(15,23,42,.08);color:#334155;font-size:24px;line-height:1;cursor:pointer;transition:.2s}
          .home-product-close:hover{background:#0f172a;color:#fff;transform:rotate(90deg)}
          .home-product-main{display:grid;grid-template-columns:1.08fr .92fr;gap:0}
          .home-product-gallery{padding:28px;background:linear-gradient(145deg,#eef6ff,#f4fbff);min-height:520px}
          .home-product-main-image{width:100%;height:390px;object-fit:contain;border-radius:18px;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.08)}
          .home-product-thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
          .home-product-thumb{width:72px;height:58px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;background:#fff;transition:.2s}
          .home-product-thumb.active{border-color:var(--primary);box-shadow:0 5px 15px rgba(37,99,235,.18)}
          .home-product-info{padding:42px 36px 36px}
          .home-product-cat{display:inline-flex;padding:6px 11px;border-radius:999px;background:#eef4ff;color:var(--primary);font-size:.7rem;font-weight:700;margin-bottom:13px}
          .home-product-info h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;margin:0 0 12px;color:var(--dark)}
          .home-product-description{color:var(--gray);font-size:.92rem;line-height:1.8;white-space:pre-line;margin-bottom:20px}
          .home-product-label{font-size:.78rem;font-weight:700;color:var(--dark-soft);margin:18px 0 9px}
          .home-product-tags{display:flex;flex-wrap:wrap;gap:7px}
          .home-product-tag{font-size:.7rem;padding:6px 9px;border-radius:8px;background:#eff5ff;color:#526079;font-weight:600}
          .home-product-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
          .home-product-live{display:inline-flex;align-items:center;gap:8px;background:var(--gradient);color:#fff;border-radius:11px;padding:12px 17px;font-size:.8rem;font-weight:700;text-decoration:none}
          .home-product-live:hover{color:#fff;transform:translateY(-2px);box-shadow:0 10px 25px rgba(37,99,235,.22)}
          .home-product-no-image{height:390px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:50px}
          @media(max-width:800px){.home-product-main{grid-template-columns:1fr}.home-product-gallery{min-height:auto;padding:22px}.home-product-main-image,.home-product-no-image{height:300px}.home-product-info{padding:28px 22px 30px}}
          @media(max-width:575px){.home-product-modal{padding:10px}.home-product-dialog{max-height:94vh;border-radius:20px}.home-product-main-image,.home-product-no-image{height:240px}.home-product-close{right:10px;top:10px}}
          '''
          if '/* Product details modal */' not in text:
              text = text.replace('</style>', css + '\n  </style>', 1)

          modal = r'''
          <!-- Product Details Modal -->
          <div id="homeProductModal" class="home-product-modal" aria-hidden="true">
            <div class="home-product-dialog" role="dialog" aria-modal="true" aria-labelledby="homeProductTitle">
              <button id="homeProductClose" class="home-product-close" type="button" aria-label="Close">×</button>
              <div id="homeProductDetail"></div>
            </div>
          </div>
          '''
          if 'id="homeProductModal"' not in text:
              text = text.replace('  <!-- Supabase -->', modal + '\n  <!-- Supabase -->', 1)

          new_home_js = r'''    /* ── Dynamic Products Showcase ── */
          (async function loadHomeProducts(){
            const grid=document.getElementById('homeProductsGrid');if(!grid||!window.supabase)return;
            const client=window.supabase.createClient('https://zfgjhunmdpqzpmdnqtyv.supabase.co','sb_publishable_grTmssZ9sTu5YKXrH0ET6A_8wDNP2IT');
            const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
            const tags=value=>Array.isArray(value)?value:String(value??'').split(/[,\n]+/).map(v=>v.trim()).filter(Boolean);
            const galleryUrls=product=>{
              const keys=['gallery','gallery_images','gallery_urls','image_gallery','images','screenshots','product_images'];
              let result=[];
              for(const key of keys){
                const value=product?.[key];
                if(Array.isArray(value)) result.push(...value);
                else if(value){try{const parsed=JSON.parse(value);if(Array.isArray(parsed)) result.push(...parsed);else result.push(...tags(value))}catch{result.push(...tags(value))}}
              }
              if(product?.image_url) result.unshift(product.image_url);
              return [...new Set(result.map(v=>typeof v==='object'?(v.url||v.image_url||v.src||''):String(v)).filter(Boolean))];
            };
            window.homeProducts=[];
            window.openHomeProduct=function(index){
              const p=window.homeProducts[index];if(!p)return;
              const modal=document.getElementById('homeProductModal'),detail=document.getElementById('homeProductDetail');
              const name=p.name||'HOPIX Product',category=p.category||'Digital Product',description=p.description||p.short_description||'A digital solution built by HOPIX Tech Solutions.';
              const images=galleryUrls(p),features=tags(p.features),technologies=tags(p.technologies),url=p.product_url||p.live_url||p.website_url||p.demo_url||p.url||'';
              detail.innerHTML=`<div class="home-product-main"><div class="home-product-gallery">${images.length?`<img id="homeProductMainImage" class="home-product-main-image" src="${esc(images[0])}" alt="${esc(name)}">`:`<div class="home-product-no-image"><i class="bi bi-window-stack"></i></div>`}<div class="home-product-thumbs">${images.map((img,i)=>`<img class="home-product-thumb ${i===0?'active':''}" src="${esc(img)}" alt="${esc(name)} image ${i+1}" data-img="${esc(img)}">`).join('')}</div></div><div class="home-product-info"><span class="home-product-cat">${esc(category)}</span><h2 id="homeProductTitle">${esc(name)}</h2><div class="home-product-description">${esc(description)}</div>${technologies.length?`<div class="home-product-label">Technologies</div><div class="home-product-tags">${technologies.map(t=>`<span class="home-product-tag">${esc(t)}</span>`).join('')}</div>`:''}${features.length?`<div class="home-product-label">Features</div><div class="home-product-tags">${features.map(t=>`<span class="home-product-tag">${esc(t)}</span>`).join('')}</div>`:''}${url?`<div class="home-product-actions"><a class="home-product-live" href="${esc(url)}" target="_blank" rel="noopener">Open Live Product <i class="bi bi-box-arrow-up-right"></i></a></div>`:''}</div></div>`;
              detail.querySelectorAll('.home-product-thumb').forEach(thumb=>thumb.addEventListener('click',()=>{const main=document.getElementById('homeProductMainImage');if(main){main.src=thumb.dataset.img}detail.querySelectorAll('.home-product-thumb').forEach(x=>x.classList.remove('active'));thumb.classList.add('active')}));
              modal.classList.add('show');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
            };
            const closeHomeProduct=()=>{const modal=document.getElementById('homeProductModal');modal?.classList.remove('show');modal?.setAttribute('aria-hidden','true');document.body.style.overflow='';};
            document.getElementById('homeProductClose')?.addEventListener('click',closeHomeProduct);
            document.getElementById('homeProductModal')?.addEventListener('click',e=>{if(e.target.id==='homeProductModal')closeHomeProduct()});
            document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHomeProduct()});
            try{
              const {data,error}=await client.from('products').select('*').eq('status','published').order('created_at',{ascending:false}).limit(3);if(error)throw error;
              window.homeProducts=data||[];
              if(!window.homeProducts.length){grid.innerHTML='<div class="products-empty-home">Our newest products are coming soon.</div>';return;}
              grid.innerHTML=window.homeProducts.map((product,index)=>{const name=product.name||'HOPIX Product',category=product.category||'Digital Product',description=product.short_description||product.description||'A digital solution built by HOPIX Tech Solutions.',image=product.image_url||'',technologies=tags(product.technologies).slice(0,3);return `<article class="product-card-home"><div class="product-image-home">${image?`<img src="${esc(image)}" alt="${esc(name)}" loading="lazy">`:'<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;color:rgba(37,99,235,.22)"><i class="bi bi-window-stack"></i></div>'}<span class="product-category-home">${esc(category)}</span></div><div class="product-content-home"><h3>${esc(name)}</h3><p>${esc(description)}</p><div class="product-meta-home">${technologies.map(t=>`<span class="product-tag-home">${esc(t)}</span>`).join('')}</div><button type="button" class="product-link-home" onclick="openHomeProduct(${index})">View Product <i class="bi bi-arrow-right"></i></button></div></article>`}).join('');
            }catch(error){console.error('Home products error:',error);grid.innerHTML='<div class="products-empty-home">Products are temporarily unavailable. Please try again shortly.</div>'}
          })();'''

          pattern = re.compile(r'    /\* ── Dynamic Products Showcase ── \*/.*?\n    \}\)\(\);', re.S)
          text, n = pattern.subn(new_home_js, text, count=1)
          if n != 1:
              raise SystemExit('Homepage product showcase block not found')
          home.write_text(text, encoding='utf-8')

          prod = Path('products/index.html')
          ptext = prod.read_text(encoding='utf-8')
          pcss = r'''
          /* Product gallery + direct live product button */
          .gallery{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.gallery img{width:82px;height:62px;object-fit:cover;border-radius:10px;border:1px solid #dfe7f1;background:#f7faff}
          .view{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#fff;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:700;border:0;cursor:pointer;text-decoration:none}.view:hover{color:#fff;transform:translateY(-1px)}
          '''
          if '/* Product gallery + direct live product button */' not in ptext:
              ptext=ptext.replace('</style>',pcss+'\n</style>',1)

          # On the all-products page, View Product should go straight to the product URL.
          old = re.compile(r'<button class="view" onclick="openProduct\(\$\{i\}\)">View Product <i class="bi bi-arrow-right"></i></button>')
          new = r'''${url?`<a class="view" href="${esc(url)}" target="_blank" rel="noopener">View Product <i class="bi bi-box-arrow-up-right"></i></a>`:'<span class="view" style="opacity:.55;cursor:default">Live Product Unavailable</span>'}'''
          ptext, n = old.subn(new, ptext, count=1)
          if n != 1:
              raise SystemExit('Products page View Product button not found')

          # Add gallery images to the product details modal for compatibility and future use.
          open_old = re.compile(r'window\.openProduct=function\(i\)\{.*?\};\n', re.S)
          open_new = r'''window.openProduct=function(i){const p=window.currentList[i];if(!p)return;const name=val(p,'name','product_name')||'HOPIX Product',desc=val(p,'description','short_description','short')||'',images=(function(){let out=[];for(const k of ['gallery','gallery_images','gallery_urls','image_gallery','images','screenshots','product_images']){const v=p?.[k];if(Array.isArray(v))out.push(...v);else if(v){try{const x=JSON.parse(v);out.push(...(Array.isArray(x)?x:arr(v)))}catch{out.push(...arr(v))}}}const main=val(p,'image_url','image','main_image_url');if(main)out.unshift(main);return [...new Set(out.map(v=>typeof v==='object'?(v.url||v.image_url||v.src||''):String(v)).filter(Boolean))]})();const url=val(p,'product_url','live_url','website_url','demo_url','url');mt.textContent=name;detail.innerHTML=`${images[0]?`<img src="${esc(images[0])}" alt="${esc(name)}">`:''}<h2>${esc(name)}</h2><p>${esc(desc)}</p>${images.length>1?`<div class="gallery">${images.slice(1).map(img=>`<img src="${esc(img)}" alt="${esc(name)}">`).join('')}</div>`:''}${url?`<a class="live" href="${esc(url)}" target="_blank" rel="noopener">Open Live Product <i class="bi bi-box-arrow-up-right"></i></a>`:''}`;modal.classList.add('show')};
'''
          ptext, n = open_old.subn(open_new, ptext, count=1)
          if n != 1:
              raise SystemExit('Products page openProduct function not found')
          prod.write_text(ptext, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html products/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add product details modal and direct product links"
          git push

      - name: Remove one-time patch workflow
        if: success()
        run: |
          git rm .github/workflows/fix-product-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time product UI patch workflow"
          git push
