name: Install HOPIX Products Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Products integration
        run: python scripts/integrate_products.py

      - name: Commit integration and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html products/index.html scripts/integrate_products.py
          git rm -f .github/workflows/install-products-final.yml
          git commit -m "Integrate dynamic Products into HOPIX website"
          git push
